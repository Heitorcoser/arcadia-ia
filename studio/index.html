<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcádia Studio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/lua/lua.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }</script>
<style>
  :root{--bg:#16181f;--painel:#1f222b;--painel2:#272b36;--linha:#333847;--linha2:#424859;--txt:#e6e8ef;--fraco:#9aa1b5;--fraco2:#6c7389;--azul:#3b82f6;--azul2:#2563eb;--verde:#22c55e;--verm:#ef4444;--amar:#f59e0b;--sel:#2c4a7c}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:13px "Segoe UI",system-ui,sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  #app{display:grid;grid-template-rows:auto auto 1fr auto;height:100vh}
  /* topo */
  #topo{display:flex;align-items:center;gap:6px;height:38px;padding:0 8px;background:#121419;border-bottom:1px solid var(--linha)}
  .logo{display:flex;align-items:center;gap:8px;font-weight:700;margin-right:8px;white-space:nowrap}
  .logo i{width:22px;height:22px;border-radius:6px;background:conic-gradient(from 200deg,#3b82f6,#22d3ee,#8b5cf6,#3b82f6);display:inline-block}
  .aba-r{background:none;border:0;padding:0 12px;height:38px;color:var(--fraco);border-bottom:2px solid transparent}
  .aba-r.on{color:var(--txt);border-bottom-color:var(--azul)}
  #nome-proj{margin-left:auto;background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 8px;width:220px;text-align:right;font-weight:600}
  #nome-proj:hover,#nome-proj:focus{border-color:var(--linha2);outline:none;background:var(--painel)}
  #salvo{color:var(--fraco2);font-size:12px;min-width:70px}
  .pilula{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--linha2);background:var(--painel);white-space:nowrap}
  .pilula i{width:8px;height:8px;border-radius:50%;background:var(--fraco2)}
  .pilula.ok i{background:var(--verde);box-shadow:0 0 6px var(--verde)} .pilula.esperando i{background:var(--amar)}
  .btn-pri{height:28px;padding:0 14px;border-radius:7px;border:0;background:var(--azul);font-weight:600}
  .btn-pri:hover{background:var(--azul2)}
  /* faixa */
  #faixa{display:flex;align-items:stretch;gap:2px;min-height:78px;padding:4px 6px;background:var(--painel);border-bottom:1px solid var(--linha);overflow-x:auto}
  .grupo{display:flex;flex-direction:column;border-right:1px solid var(--linha);padding:0 6px}
  .grupo .itens{display:flex;gap:2px;flex:1;align-items:center}
  .grupo .rot{font-size:10.5px;color:var(--fraco2);text-align:center;padding-top:2px}
  .fb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:52px;height:54px;padding:2px 6px;background:none;border:1px solid transparent;border-radius:6px;font-size:11.5px;color:var(--txt)}
  .fb span.ic{font-size:20px;line-height:1}
  .fb:hover{background:var(--painel2);border-color:var(--linha2)}
  .fb.on{background:var(--sel);border-color:#3d64a8}
  .fb:disabled{opacity:.35;cursor:default}
  .fb.play span.ic{color:var(--verde)} .fb.stop span.ic{color:var(--verm)}
  .mini-col{display:flex;flex-direction:column;gap:3px}
  .mini-col label{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--fraco)}
  .mini-col input[type=number]{width:52px;background:var(--bg);border:1px solid var(--linha2);border-radius:4px;padding:1px 4px}
  .mini-col select,.mini-col input[type=color]{background:var(--bg);border:1px solid var(--linha2);border-radius:4px;height:22px}
  /* corpo */
  #corpo{--esq:var(--esq-t,230px);--dir:var(--dir-t,300px);--baixo:var(--baixo-t,170px);display:grid;grid-template-columns:var(--esq) minmax(0,1fr) var(--dir);grid-template-rows:minmax(0,1fr) var(--baixo);min-height:0}
  #corpo.sem-esq{--esq:0px} #corpo.sem-dir{--dir:0px} #corpo.sem-baixo{--baixo:0px}
  #corpo.sem-esq #esq .divisoria,#corpo.sem-dir #dir>.divisoria,#corpo.sem-baixo #baixo .divisoria{display:none}
  .painel{background:var(--painel);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;position:relative}
  /* divisórias arrastáveis */
  .divisoria{position:absolute;z-index:15;touch-action:none}
  .divisoria.v{top:0;bottom:0;width:6px;cursor:col-resize}
  .divisoria.h{left:0;right:0;height:6px;cursor:row-resize}
  .divisoria.direita{right:0} .divisoria.esquerda{left:0} .divisoria.cima{top:-1px}
  .divisoria::after{content:"";position:absolute;inset:0;background:var(--azul);opacity:0;transition:opacity .12s}
  .divisoria.v::after{left:2px;right:2px} .divisoria.h::after{top:2px;bottom:2px}
  .divisoria:hover::after{opacity:.55;transition-delay:.15s} .divisoria.ativa::after{opacity:1}
  body.redimensionando{user-select:none} body.redimensionando iframe,body.redimensionando canvas{pointer-events:none}
  body.cursor-v,body.cursor-v *{cursor:col-resize!important} body.cursor-h,body.cursor-h *{cursor:row-resize!important}
  .cab{display:flex;align-items:center;gap:6px;height:28px;padding:0 8px;background:var(--painel2);border-bottom:1px solid var(--linha);font-weight:600;font-size:12px;flex-shrink:0}
  .cab .acoes{margin-left:auto;display:flex;gap:2px}
  .cab .acoes button{background:none;border:0;color:var(--fraco);padding:2px 5px;border-radius:4px}
  .cab .acoes button:hover{background:var(--linha);color:var(--txt)}
  #esq{grid-column:1;grid-row:1/3;border-right:1px solid var(--linha)}
  #dir{grid-column:3;grid-row:1/3;border-left:1px solid var(--linha)}
  #centro{grid-column:2;grid-row:1;position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
  #baixo{grid-column:2;grid-row:2;border-top:1px solid var(--linha)}
  /* caixa de ferramentas */
  #busca-cx{margin:6px;background:var(--bg);border:1px solid var(--linha2);border-radius:6px;padding:5px 8px;outline:none}
  #caixa{overflow:auto;padding:0 6px 10px;flex:1}
  .cx-cat{font-size:11px;font-weight:700;color:var(--fraco2);text-transform:uppercase;letter-spacing:.6px;margin:10px 2px 5px}
  .cx-grade{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
  .cx-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 3px;background:var(--painel2);border:1px solid var(--linha);border-radius:7px;font-size:11px;text-align:center;line-height:1.15}
  .cx-item span{font-size:22px}
  .cx-item:hover{border-color:var(--azul);background:#273349}
  /* abas do centro */
  #abas{display:flex;height:30px;background:#14161c;border-bottom:1px solid var(--linha);overflow-x:auto;flex-shrink:0}
  .aba{display:flex;align-items:center;gap:6px;padding:0 10px;border-right:1px solid var(--linha);color:var(--fraco);white-space:nowrap;cursor:pointer;user-select:none}
  .aba.on{background:var(--bg);color:var(--txt);box-shadow:inset 0 2px 0 var(--azul)}
  .aba .x{opacity:.5;border:0;background:none;padding:0 2px} .aba .x:hover{opacity:1}
  .aba.mod::after{content:"●";font-size:9px;color:var(--amar)}
  #conteudo{position:relative;flex:1;min-height:0}
  .vista{position:absolute;inset:0;display:none}
  .vista.on{display:block}
  #vista-cena canvas{display:block;outline:none}
  .CodeMirror{height:100%;font:13.5px/1.5 Consolas,"Cascadia Code",monospace;background:#15171d!important}
  .CodeMirror-gutters{background:#15171d!important;border-right:1px solid var(--linha)!important}
  .CodeMirror-activeline-background{background:#1f2330!important}
  #vista-previa iframe,#vista-jogo iframe{width:100%;height:100%;border:0;background:#000}
  .img-prev{display:flex;align-items:center;justify-content:center;height:100%;background:repeating-conic-gradient(#20232c 0 25%,#1a1c23 0 50%) 0 0/20px 20px}
  .img-prev img{max-width:90%;max-height:90%}
  #info-cena{position:absolute;left:8px;bottom:8px;font-size:11.5px;color:var(--fraco);background:rgba(0,0,0,.45);padding:3px 8px;border-radius:6px;pointer-events:none}
  #faixa-jogo{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:5;display:none;gap:8px;align-items:center;background:rgba(10,12,18,.85);border:1px solid var(--linha2);padding:4px 6px 4px 12px;border-radius:9px}
  #faixa-jogo.on{display:flex}
  /* explorer */
  #dir .metade{flex:1 1 0;display:flex;flex-direction:column;min-height:0;position:relative}
  #dir .metade + .metade{border-top:1px solid var(--linha)}
  #filtro-exp{margin:5px 6px;background:var(--bg);border:1px solid var(--linha2);border-radius:5px;padding:3px 7px;outline:none;font-size:12px}
  #arvore{overflow:auto;flex:1;padding-bottom:20px;user-select:none}
  .no{display:flex;align-items:center;gap:4px;height:22px;padding-right:6px;white-space:nowrap;cursor:default}
  .no:hover{background:#262a35}
  .no.sel{background:var(--sel)}
  .no.alvo-drop{box-shadow:inset 0 0 0 1px var(--azul)}
  .no .seta{width:14px;text-align:center;color:var(--fraco2);font-size:9px;flex-shrink:0}
  .no .ico{width:18px;text-align:center;flex-shrink:0}
  .no .nm{overflow:hidden;text-overflow:ellipsis}
  .no .cl{color:var(--fraco2);font-size:11px;margin-left:4px}
  .no input{background:var(--bg);border:1px solid var(--azul);border-radius:3px;padding:0 4px;height:19px;outline:none;width:150px}
  /* propriedades */
  #props{overflow:auto;flex:1;padding-bottom:20px}
  .p-sec{font-size:11px;font-weight:700;color:var(--fraco2);background:#1b1e26;padding:4px 8px;text-transform:uppercase;letter-spacing:.5px;border-top:1px solid var(--linha)}
  .p-lin{display:grid;grid-template-columns:42% 58%;align-items:center;min-height:24px;border-bottom:1px solid #262a34}
  .p-lin>label{padding:0 8px;color:var(--fraco);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .p-lin>div{display:flex;gap:3px;padding:2px 6px 2px 0;align-items:center;min-width:0}
  .p-lin input[type=text],.p-lin input[type=number],.p-lin select{width:100%;min-width:0;background:var(--bg);border:1px solid var(--linha);border-radius:4px;padding:2px 5px;height:21px;outline:none}
  .p-lin input:focus,.p-lin select:focus{border-color:var(--azul)}
  .p-lin input[type=color]{width:28px;height:21px;padding:0;border:1px solid var(--linha);border-radius:4px;background:none;flex-shrink:0}
  .p-lin input[type=checkbox]{width:15px;height:15px;accent-color:var(--azul)}
  .p-vazio{padding:16px;color:var(--fraco2);text-align:center;line-height:1.6}
  .p-desc{padding:8px;color:var(--fraco);font-size:12px;line-height:1.5;border-bottom:1px solid var(--linha)}
  .p-btn{background:var(--painel2);border:1px solid var(--linha2);border-radius:4px;padding:2px 8px}
  /* saída */
  #saida{flex:1;overflow:auto;padding:4px 8px;font:12.5px/1.55 Consolas,monospace}
  #saida div{white-space:pre-wrap;word-break:break-word}
  #saida .t{color:var(--fraco2);margin-right:8px}
  #saida .warn{color:#fbbf24} #saida .error{color:#f87171} #saida .info{color:#93c5fd} #saida .ok{color:#86efac}
  #comando{display:flex;border-top:1px solid var(--linha)}
  #comando span{padding:0 8px;line-height:26px;color:var(--fraco2);font-family:Consolas,monospace}
  #comando input{flex:1;background:var(--bg);border:0;outline:none;padding:0 8px;height:26px;font-family:Consolas,monospace}
  /* menus e modais */
  .menu{position:fixed;z-index:100;min-width:200px;background:#20232c;border:1px solid var(--linha2);border-radius:8px;padding:4px;box-shadow:0 12px 30px rgba(0,0,0,.5);display:none}
  .menu.on{display:block}
  .menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:5px 10px;border-radius:5px;white-space:nowrap}
  .menu button:hover{background:var(--sel)}
  .menu button .k{margin-left:auto;color:var(--fraco2);font-size:11px;padding-left:20px}
  .menu hr{border:0;border-top:1px solid var(--linha);margin:4px 0}
  .menu .sub{position:relative}
  .modal-fundo{position:fixed;inset:0;z-index:90;background:rgba(5,6,10,.7);display:none;align-items:center;justify-content:center;padding:20px}
  .modal-fundo.on{display:flex}
  .modal{width:min(880px,100%);max-height:90vh;overflow:auto;background:var(--painel);border:1px solid var(--linha2);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .modal h2{margin:0;font-size:20px}
  .modal .m-cab{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--linha)}
  .modal .m-cab button{margin-left:auto;background:none;border:0;font-size:18px;color:var(--fraco)}
  .modal .m-corpo{padding:16px 20px}
  .modelos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px}
  .modelo{background:var(--painel2);border:1px solid var(--linha);border-radius:10px;padding:14px 10px;text-align:center;line-height:1.35}
  .modelo span{font-size:30px;display:block;margin-bottom:6px}
  .modelo b{display:block;font-size:13px} .modelo small{color:var(--fraco);font-size:11.5px}
  .modelo:hover{border-color:var(--azul);background:#24304a}
  .m-sec{font-size:12px;font-weight:700;color:var(--fraco);text-transform:uppercase;letter-spacing:.6px;margin:4px 0 10px}
  .recentes{display:flex;flex-direction:column;gap:6px}
  .recente{display:flex;align-items:center;gap:10px;background:var(--painel2);border:1px solid var(--linha);border-radius:8px;padding:8px 12px}
  .recente:hover{border-color:var(--azul)}
  .recente .nm{font-weight:600} .recente .dt{color:var(--fraco2);font-size:12px;margin-left:auto}
  .recente button{background:none;border:0;color:var(--fraco2)} .recente button:hover{color:var(--verm)}
  .campo{display:block;margin-bottom:12px} .campo span{display:block;font-size:12px;color:var(--fraco);margin-bottom:4px}
  .campo input,.campo textarea,.campo select{width:100%;background:var(--bg);border:1px solid var(--linha2);border-radius:7px;padding:7px 10px;outline:none}
  .campo textarea{min-height:70px;resize:vertical}
  .linha2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .caixa-link{display:flex;gap:6px} .caixa-link input{flex:1;font-family:Consolas,monospace;font-size:12px}
  .btn{height:32px;padding:0 14px;border-radius:7px;border:1px solid var(--linha2);background:var(--painel2)}
  .btn:hover{border-color:var(--azul)}
  .doc{line-height:1.6;color:#cfd3df} .doc h3{margin:18px 0 6px;color:#fff} .doc code,.doc pre{font-family:Consolas,monospace;background:#14161c;border:1px solid var(--linha);border-radius:5px}
  .doc code{padding:0 4px} .doc pre{padding:10px;overflow:auto;font-size:12.5px}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;background:#2a2f3c;border:1px solid var(--linha2);padding:8px 16px;border-radius:9px;opacity:0;transition:.25s;pointer-events:none}
  #toast.on{opacity:1}
  #arrastar-arquivos{position:absolute;inset:0;z-index:20;background:rgba(59,130,246,.18);border:2px dashed var(--azul);display:none;align-items:center;justify-content:center;font-size:18px;font-weight:600}
  @media (max-width:900px){ #corpo{--esq:0px;--dir:250px} }
</style>
</head>
<body>
<div id="app">
  <div id="topo">
    <div class="logo"><i></i>Arcádia Studio</div>
    <button class="aba-r" data-faixa="arquivo">Arquivo</button>
    <button class="aba-r on" data-faixa="inicio">Início</button>
    <button class="aba-r" data-faixa="modelo">Modelo</button>
    <button class="aba-r" data-faixa="testar">Testar</button>
    <button class="aba-r" data-faixa="exibir">Exibir</button>
    <input id="nome-proj" title="Nome do projeto" spellcheck="false">
    <span id="salvo"></span>
    <button class="pilula" id="btn-mcp" title="Conectar uma IA pelo MCP"><i></i><span>MCP</span></button>
    <a class="pilula" href="../index.html" style="text-decoration:none;color:inherit">🏠 Plataforma</a>
    <span id="conta-lugar"></span>
    <button class="btn-pri" id="btn-publicar">Publicar</button>
  </div>
  <div id="faixa"></div>
  <div id="corpo">
    <aside class="painel" id="esq">
      <div class="cab" id="cab-esq">🧰 Caixa de ferramentas</div>
      <input id="busca-cx" placeholder="Buscar…" spellcheck="false">
      <div id="caixa"></div>
    </aside>
    <main id="centro">
      <div id="abas"></div>
      <div id="conteudo">
        <div class="vista on" id="vista-cena"><div id="info-cena"></div></div>
        <div class="vista" id="vista-codigo"></div>
        <div class="vista" id="vista-previa"></div>
        <div class="vista" id="vista-jogo"></div>
        <div id="faixa-jogo"><span>▶ Jogando</span><button class="btn" id="btn-parar-jogo">■ Parar</button></div>
        <div id="arrastar-arquivos">Solte os arquivos para adicionar ao projeto</div>
      </div>
    </main>
    <aside class="painel" id="dir">
      <div class="metade">
        <div class="cab">🌳 Explorer<div class="acoes"><button id="exp-novo" title="Inserir objeto">＋</button><button id="exp-recolher" title="Recolher tudo">⊟</button></div></div>
        <input id="filtro-exp" placeholder="Filtrar…" spellcheck="false">
        <div id="arvore" tabindex="0"></div>
      </div>
      <div class="metade">
        <div class="cab">⚙️ Propriedades</div>
        <div id="props"></div>
      </div>
    </aside>
    <section class="painel" id="baixo">
      <div class="cab">📟 Saída<div class="acoes"><button id="limpar-saida" title="Limpar">🧹</button></div></div>
      <div id="saida"></div>
      <div id="comando"><span>&gt;</span><input id="cmd" placeholder="Barra de comando (JavaScript com a API studio.*). Ex: studio.criar({classe:'Part', propriedades:{Color:'#ff0000'}})" spellcheck="false"></div>
    </section>
  </div>
</div>

<div class="menu" id="menu"></div>
<div class="modal-fundo" id="modal"><div class="modal" id="modal-caixa"></div></div>
<div id="toast"></div>
<input type="file" id="in-arquivos" multiple hidden>
<input type="file" id="in-importar" accept=".zip,.json,.arcadia" hidden>
<input type="file" id="in-pasta" webkitdirectory hidden>

<script src="nucleo.js"></script>
<script src="studio.js"></script>
<script src="paineis.js"></script>
<script src="../conta.js?v=1.2.0"></script>
</body>
</html>
