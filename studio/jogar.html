<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Arcádia · Jogar</title>
<script>
/* Versão e cache: o navegador e o app guardam esta página por um tempo (até ~10 min no GitHub Pages).
   Ao abrir, pergunta ao servidor (sem cache) a versão atual e, se esta página for velha, recarrega
   com ?v=versão para pegar os arquivos novos. Mantenha igual a "versao" em ../versao.json. */
window.VERSAO_STUDIO = "1.27.0";
(function () {
  fetch("../versao.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.json()).then(d => {
    const v = String(d.versao || ""); let tentou = "";
    try { tentou = sessionStorage.getItem("arcadia.recarregou.jogar") || ""; } catch (e) {}
    if (!v || v === window.VERSAO_STUDIO || tentou === v) return;
    try { sessionStorage.setItem("arcadia.recarregou.jogar", v); } catch (e) {}
    const q = new URLSearchParams(location.search); q.set("v", v);
    location.replace(location.pathname + "?" + q.toString() + location.hash);
  }).catch(() => {});
})();
</script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0d14;color:#e8eaf2;font-family:"Segoe UI",system-ui,sans-serif}
  #jogo{position:fixed;inset:0}
  #jogo canvas{display:block;touch-action:none}
  .as-ui{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
  .as-el{box-sizing:border-box}
  .as-TextButton{border:0;cursor:pointer;color:inherit;transition:filter .12s,transform .08s}
  .as-TextButton:hover{filter:brightness(1.12)} .as-TextButton:active{transform:translate(var(--tx,0),var(--ty,0)) scale(.97)}
  .as-hud{position:absolute;inset:0;pointer-events:none;z-index:6}
  .as-placar{position:absolute;right:10px;top:10px;min-width:170px;background:rgba(20,22,32,.72);border-radius:10px;padding:6px 10px;font-size:14px;backdrop-filter:blur(6px)}
  .as-placar>div{display:flex;justify-content:space-between;gap:16px;padding:2px 0}
  .as-placar-cab{font-weight:700;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:3px;padding-bottom:4px!important}
  .as-vida{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:220px;height:10px;background:rgba(0,0,0,.5);border-radius:6px;overflow:hidden}
  .as-vida i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#86efac)}
  .as-kick{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.8);font-size:22px;padding:30px;text-align:center}
  .as-toque{position:absolute;inset:0;z-index:4;touch-action:none}
  .as-joy{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.2);display:none;transform:translate(-50%,-50%)}
  .as-joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.45)}
  .as-pular{position:absolute;right:28px;bottom:36px;width:84px;height:84px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.18);color:#fff;font-size:34px}
  #carregando{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:30;background:#0b0d14}
  #carregando .roda{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:#60a5fa;animation:gira 1s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  #erro{position:fixed;left:12px;bottom:12px;right:12px;z-index:40;background:rgba(127,29,29,.92);border-radius:10px;padding:10px 14px;font:13px Consolas,monospace;white-space:pre-wrap;display:none;max-height:40vh;overflow:auto}
  #barra{position:fixed;left:0;right:0;top:0;height:40px;z-index:50;display:none;align-items:center;gap:12px;padding:0 12px;background:#11131c;border-bottom:1px solid #262a3a;font-size:14px}
  #barra b{font-weight:700} #barra a{color:#93c5fd;margin-left:auto;text-decoration:none}
  #moldura{position:fixed;left:0;right:0;bottom:0;top:40px;border:0;width:100%;height:calc(100% - 40px);display:none}
  .dica{position:absolute;left:12px;bottom:12px;z-index:7;font-size:12px;color:rgba(255,255,255,.65);background:rgba(0,0,0,.35);padding:4px 10px;border-radius:8px;pointer-events:none;transition:opacity 1s}
</style>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<div id="carregando"><div class="roda"></div><div id="msg">Carregando jogo…</div></div>
<div id="jogo"></div>
<div id="erro"></div>
<div id="barra"><span>🎮</span><b id="titulo"></b><span id="autor" style="color:#9aa3b8"></span><a href="../index.html">Arcádia IA ↗</a></div>
<iframe id="moldura" sandbox="allow-scripts allow-pointer-lock allow-popups" allow="autoplay; fullscreen; gamepad"></iframe>
<script src="nucleo.js?v=1.27.0"></script>
<script src="avatar.js?v=1.27.0"></script>
<script src="motor.js?v=1.27.0"></script>
<script src="rede.js?v=1.27.0"></script>
<script src="../salas-publicas.js?v=1"></script>
<script src="../conta.js?v=1.27.0"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const embutido = params.has('embed');
  const $ = s => document.querySelector(s);
  const avisarPai = msg => { try { parent.postMessage(Object.assign({ fonte: 'as-jogo' }, msg), '*'); } catch (e) {} };
  const log = (nivel, texto) => { avisarPai({ tipo: 'log', nivel, texto }); (nivel === 'error' ? console.error : nivel === 'warn' ? console.warn : console.log)(texto); if (nivel === 'error' && !embutido) mostrarErro(texto); };
  function mostrarErro(t) { const e = $('#erro'); e.style.display = 'block'; e.textContent = (e.textContent ? e.textContent + '\n' : '') + t; }
  window.addEventListener('error', e => log('error', e.message || 'Erro'));
  let instancia = null;

  async function rodar(projeto, opcoes = {}) {
    try {
      if (projeto.tipo === 'arquivos') {
        $('#msg').textContent = 'Montando projeto…';
        const html = await ASN.construirHTML(projeto, t => { $('#msg').textContent = t; });
        avisarPai({ tipo: 'pronto' });
        document.open(); document.write(html); document.close();
        return;
      }
      instancia = await ASM.iniciar($('#jogo'), projeto, Object.assign({ log }, opcoes));
      window.__jogo = instancia;
      $('#carregando').style.display = 'none';
      const d = document.createElement('div'); d.className = 'dica'; d.textContent = matchMedia('(pointer: coarse)').matches ? 'Joystick à esquerda · arraste à direita para olhar · pinça aproxima · toque clica · botão pula' : 'WASD andar · Espaço pular · botão direito arrasta a câmera · roda do mouse aproxima';
      document.body.appendChild(d); setTimeout(() => d.style.opacity = 0, 6000);
      avisarPai({ tipo: 'pronto' });
    } catch (e) { log('error', 'Falha ao iniciar: ' + (e.message || e)); $('#msg').textContent = 'Não foi possível iniciar o jogo.'; }
  }

  window.addEventListener('message', e => {
    const d = e.data; if (!d || typeof d !== 'object') return;
    if (d.tipo === 'carregar' && d.projeto) rodar(d.projeto, d.opcoes || {});
    if (d.tipo === 'captura' && instancia) avisarPai({ tipo: 'captura', imagem: instancia.captura() });
  });

  if (embutido) { avisarPai({ tipo: 'aguardando' }); return; }

  // página aberta diretamente: carrega por link (#p=…) ou arquivo (?arquivo=…) dentro de uma moldura isolada
  (async () => {
    let projeto = null;
    try {
      const h = location.hash.match(/#p=([^&]+)/);
      if (h) projeto = await ASN.descompactar(h[1]);
      else if (params.get('arquivo')) { const r = await fetch(params.get('arquivo')); if (!r.ok) throw new Error('HTTP ' + r.status); projeto = await r.json(); }
      else if (params.get('local')) { const reg = await ASN.lerDb('publicados', params.get('local')); projeto = reg && reg.projeto; }
      else if (params.get('nuvem')) { // publicado para todo mundo por alguém com conta
        const j = await window.ArcadiaConta.api('baixarConteudo', { id: params.get('nuvem'), contar: true });
        projeto = JSON.parse(j.dados); projeto.autor = j.conteudo.autor + ' ✓';
      }
    } catch (e) { $('#msg').textContent = params.get('nuvem') ? 'Não deu para abrir: ' + e.message : 'Link de jogo inválido ou corrompido.'; $('.roda').style.display = 'none'; return; }
    if (!projeto) { $('#msg').innerHTML = 'Nenhum jogo para abrir.<br><a style="color:#93c5fd" href="index.html">Abrir o Arcádia Studio</a>'; $('.roda').style.display = 'none'; return; }
    document.title = (projeto.nome || 'Jogo') + ' · Arcádia';
    $('#titulo').textContent = projeto.nome || 'Jogo'; $('#autor').textContent = projeto.autor ? 'por ' + projeto.autor : '';
    $('#carregando').style.display = 'none';
    const f = $('#moldura'); f.style.display = 'block';
    // dentro da plataforma (que já tem a própria barra) o jogo ocupa a tela toda
    let naPlataforma = false; try { naPlataforma = window.top !== window; } catch (e) { naPlataforma = true; }
    if (naPlataforma) { f.style.top = '0'; f.style.height = '100%'; } else $('#barra').style.display = 'flex';
    window.addEventListener('message', e => { if (e.source === f.contentWindow && e.data && e.data.tipo === 'aguardando') f.contentWindow.postMessage({ tipo: 'carregar', projeto, opcoes: { sala: 'jogo-' + (projeto.id || projeto.nome || 'sem-nome') + '-' + (projeto.atualizado || 0), avatar: ASN.avatar.lerSalvo(), nomeJogador: ((window.ArcadiaConta && ArcadiaConta.usuario()) || {}).nome || 'Jogador' } }, '*'); });
    f.src = 'jogar.html?embed=1';
  })();
})();
</script>
</body>
</html>
