plugins {
    id 'com.android.application'
}

// A versão vem da tag do GitHub (ex.: v1.2.3 -> -Pversao=1.2.3)
def versao = (project.findProperty('versao') ?: '1.0.0').toString()
def partes = versao.tokenize('.').collect { it.toInteger() }

android {
    namespace 'io.github.heitorcoser.arcadia'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.heitorcoser.arcadia'
        minSdk 26
        targetSdk 34
        versionCode partes[0] * 10000 + partes[1] * 100 + partes[2]
        versionName versao
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'sem-chave.jks')
            storePassword System.getenv('KEYSTORE_SENHA')
            keyAlias 'arcadia'
            keyPassword System.getenv('KEYSTORE_SENHA')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
