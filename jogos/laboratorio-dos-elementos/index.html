<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Laboratório dos Elementos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0f16;--painel:#121925;--painel2:#18212f;--linha:#26324a;--txt:#e8eef8;--fraco:#93a3bd;--ac:#5eead4;--ac2:#60a5fa;--perigo:#f87171;--aviso:#fbbf24}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;font-size:14px;-webkit-tap-highlight-color:transparent}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  .titulo{font-family:"Space Grotesk",Inter,sans-serif}
  #app{display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);height:100%}
  header{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#0f1520;border-bottom:1px solid var(--linha);flex-wrap:wrap;min-height:50px}
  header h1{margin:0 8px 0 0;font-size:17px;white-space:nowrap}
  header h1 span{color:var(--ac)}
  .b{height:34px;border-radius:9px;border:1px solid var(--linha);background:var(--painel2);padding:0 10px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .b:hover{border-color:#3b4b6b}
  .b.on{border-color:var(--ac);color:var(--ac)}
  .b.pri{background:linear-gradient(180deg,#14b8a6,#0d9488);border-color:#0f766e;color:#fff}
  .b.perigo{border-color:#7f1d1d;color:#fca5a5}
  select.b{padding:0 6px}
  .grupo{display:flex;align-items:center;gap:6px;background:var(--painel);border:1px solid var(--linha);border-radius:10px;padding:2px 8px;height:34px}
  .grupo label{font-size:12px;color:var(--fraco);white-space:nowrap}
  .grupo input[type=range]{width:110px}
  .esp{flex:1}
  #corpo{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:0;min-width:0}
  /* lateral */
  #lateral{min-width:0;background:var(--painel);border-right:1px solid var(--linha);display:flex;flex-direction:column;min-height:0}
  #busca{margin:8px 8px 4px;height:34px;border-radius:9px;border:1px solid var(--linha);background:#0d131d;padding:0 10px}
  #abas{display:flex;gap:3px;padding:0 8px 6px;flex-wrap:wrap}
  #abas button{border:1px solid var(--linha);background:var(--painel2);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:600}
  #abas button.on{background:#134e4a;border-color:var(--ac);color:#ccfbf1}
  #paleta{flex:1;overflow:auto;padding:4px 8px 8px;min-height:0}
  .sec{font-size:11px;font-weight:800;color:var(--fraco);text-transform:uppercase;letter-spacing:1px;margin:8px 2px 4px}
  .lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:5px}
  .mt{border:1px solid var(--linha);background:#0f1520;border-radius:9px;padding:4px 6px;text-align:left;display:flex;gap:6px;align-items:center;min-height:40px}
  .mt:hover{border-color:#3b4b6b}
  .mt.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
  .mt .sw{width:18px;height:18px;border-radius:5px;flex:0 0 auto;border:1px solid rgba(255,255,255,.2)}
  .mt b{display:block;font-size:12px;line-height:1.1}
  .mt small{display:block;font-size:10.5px;color:var(--fraco);line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62px}
  .tabela{display:grid;grid-template-columns:repeat(18,1fr);gap:2px;font-size:9px}
  .el{aspect-ratio:1;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#0b0f16;font-weight:800;cursor:pointer;line-height:1;border:1px solid transparent;padding:0}
  .el small{font-size:6.5px;font-weight:700;opacity:.75}
  .el.sel{border-color:#fff;outline:2px solid var(--ac)}
  .el.nao{opacity:.45}
  .legenda{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;font-size:10px}
  .legenda span{display:inline-flex;align-items:center;gap:3px}
  .legenda i{width:9px;height:9px;border-radius:2px;display:inline-block}
  #pincel{border-top:1px solid var(--linha);padding:6px 8px;display:grid;grid-template-columns:1fr 1fr;gap:5px 8px;font-size:12px}
  #pincel label{color:var(--fraco);font-size:11.5px;display:flex;flex-direction:column;gap:2px}
  #pincel select,#pincel input[type=number]{height:28px;border-radius:7px;border:1px solid var(--linha);background:#0d131d;padding:0 6px}
  #ficha-mini{border-top:1px solid var(--linha);padding:8px 10px;font-size:12.5px;max-height:32vh;overflow:auto}
  #ficha-mini h3{margin:0 0 2px;font-size:15px}
  #ficha-mini .tag{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;margin:2px 3px 2px 0}
  #ficha-mini table{width:100%;border-collapse:collapse;margin-top:4px}
  #ficha-mini td{padding:2px 0;border-bottom:1px solid #1c2638;vertical-align:top}
  #ficha-mini td:first-child{color:var(--fraco);width:46%}
  /* palco */
  #palco{position:relative;min-height:0;min-width:0;display:flex;flex-direction:column}
  #ferr{display:flex;gap:4px;padding:6px 8px;overflow-x:auto;border-bottom:1px solid var(--linha);background:#0f1520;flex:0 0 auto}
  #ferr button{flex:0 0 auto;height:36px;border-radius:9px;border:1px solid var(--linha);background:var(--painel2);padding:0 9px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:4px}
  #ferr button.on{border-color:var(--ac);background:#134e4a;color:#ccfbf1}
  #area{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;background:#080b10}
  #cv{display:block;image-rendering:pixelated;touch-action:none;cursor:crosshair;border:1px solid #1e2a3e;border-radius:6px}
  #status{position:absolute;left:8px;bottom:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
  #status span{background:rgba(8,12,18,.86);border:1px solid var(--linha);border-radius:8px;padding:3px 8px;font-size:12px}
  #toasts{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;max-width:min(380px,70%);z-index:5}
  .toast{background:rgba(13,20,32,.95);border:1px solid #2b3d5c;border-left:4px solid var(--ac);border-radius:10px;padding:7px 10px;font-size:12.5px;cursor:pointer;animation:entra .25s}
  .toast b{display:block}
  .toast code{color:#a5f3fc;font-size:12px}
  @keyframes entra{from{transform:translateX(30px);opacity:0}}
  #btn-amostra{position:absolute;left:10px;top:10px;z-index:5;display:none}
  /* janelas */
  .modal{position:fixed;inset:0;background:rgba(3,6,10,.72);z-index:40;display:none;align-items:flex-start;justify-content:center;padding:18px;overflow:auto}
  .modal.on{display:flex}
  .jan{width:min(860px,100%);background:var(--painel);border:1px solid var(--linha);border-radius:16px;padding:16px 18px;margin:auto;position:relative}
  .jan h2{margin:0 0 8px;font-size:20px}
  .jan .x{position:absolute;right:10px;top:10px}
  .jan table{width:100%;border-collapse:collapse}
  .jan td,.jan th{padding:5px 6px;border-bottom:1px solid #1f2a3d;text-align:left;vertical-align:top;font-size:13px}
  .jan th{color:var(--fraco);font-weight:600}
  .grade2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .cartao{background:var(--painel2);border:1px solid var(--linha);border-radius:12px;padding:10px 12px}
  .cartao h4{margin:0 0 6px;font-size:13px;color:var(--fraco);text-transform:uppercase;letter-spacing:.5px}
  .bloco-el{width:110px;height:120px;border-radius:12px;display:flex;flex-direction:column;justify-content:space-between;padding:8px;color:#0b0f16;font-weight:800;flex:0 0 auto}
  .bloco-el .s{font-size:44px;line-height:1;font-family:"Space Grotesk"}
  .reacao{border-left:3px solid var(--ac);padding:4px 8px;margin:6px 0;background:#0f1520;border-radius:6px}
  .reacao code{color:#a5f3fc}
  .nivel{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:800;color:#0b0f16}
  .item-org{border:1px solid var(--linha);border-radius:10px;padding:8px 10px;margin:6px 0;background:#0f1520}
  .item-org .fonte{font-size:11px;color:var(--fraco);margin-top:3px}
  .aviso{background:#2a1a08;border:1px solid #7c4a0a;color:#fde68a;border-radius:10px;padding:8px 12px;font-size:12.5px;line-height:1.5}
  .exps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
  .exp{text-align:left;background:var(--painel2);border:1px solid var(--linha);border-radius:12px;padding:10px}
  .exp:hover{border-color:var(--ac)}
  .exp b{display:block;margin-bottom:3px}
  .exp small{color:var(--fraco);line-height:1.35}
  .comb{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
  .comb input{width:100%;height:38px;border-radius:9px;border:1px solid var(--linha);background:#0d131d;padding:0 10px}
  .muted{color:var(--fraco)}
  a{color:#7dd3fc}
  @media (max-width:900px), (orientation:portrait){
    #corpo{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,42vh)}
    header{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;min-height:46px}
    header .esp{display:none}
    #ferr button span{display:none}
    #ferr button{padding:0 10px;font-size:16px}
    #lateral{order:2;border-right:0;border-top:1px solid var(--linha);min-height:0}
    #pincel{grid-template-columns:1fr 1fr 1fr}
    #palco{order:1}
    header h1{font-size:15px}
    .grupo input[type=range]{width:80px}
    #lateral{overflow:auto}
    #paleta{flex:none;overflow:visible}
    #ficha-mini{max-height:none;overflow:visible}
    .grade2{grid-template-columns:1fr}
    .comb{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 class="titulo">⚗️ Laboratório dos <span>Elementos</span></h1>
    <button class="b" id="b-play" title="Pausar / continuar (espaço)">⏸ Pausar</button>
    <select class="b" id="b-vel" title="Velocidade"><option value="1">1x</option><option value="2">2x</option><option value="4">4x</option><option value="0.5">0,5x</option></select>
    <div class="grupo" title="Temperatura do ambiente (o ar volta para ela)"><label>🌡️ Ambiente</label><input type="range" id="amb" min="-200" max="300" value="25"><b id="amb-v">25 °C</b></div>
    <select class="b" id="atm" title="O que tem no ar"><option value="ar">Ar (21% O₂)</option><option value="O2">Oxigênio puro</option><option value="N2">Nitrogênio puro</option><option value="vacuo">Vácuo</option></select>
    <button class="b on" id="b-vent" title="Gases escapam pelo topo">🌬️ Ventilação</button>
    <button class="b on" id="b-luz" title="Luz para a fotossíntese das algas">💡 Luz</button>
    <button class="b" id="b-agit" title="Agitador magnético: mistura os líquidos">🌀 Agitador</button>
    <span class="esp"></span>
    <button class="b pri" id="b-exp">🧪 Experimentos</button>
    <button class="b" id="b-comb">🔀 Combinar</button>
    <button class="b" id="b-reac">📜 Reações <b id="n-reac">0</b></button>
    <button class="b" id="b-fontes">📚 Fontes</button>
    <button class="b perigo" id="b-limpar">🧹 Limpar</button>
    <button class="b" id="b-sair" title="Sair">✕</button>
  </header>
  <div id="corpo">
    <aside id="lateral">
      <input id="busca" placeholder="🔎 Buscar elemento, composto ou fórmula…" autocomplete="off">
      <div id="abas"></div>
      <div id="paleta"></div>
      <div id="pincel">
        <label>Tamanho do pincel<input type="range" id="tam" min="1" max="16" value="4"></label>
        <label>Forma dos sólidos<select id="forma"><option value="auto">Automática</option><option value="bloco">Bloco</option><option value="po">Pó / grãos</option><option value="objeto">Objeto solto (boia ou afunda)</option></select></label>
        <label>Temperatura ao colocar<select id="temp-col"><option value="amb">Ambiente</option><option value="custom">Escolher…</option></select></label>
        <label id="lb-temp" style="display:none">°C<input type="number" id="temp-v" value="25" step="10"></label>
        <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="subst"> Substituir o que já tem</label>
      </div>
      <div id="ficha-mini"></div>
    </aside>
    <section id="palco">
      <div id="ferr"></div>
      <div id="area">
        <canvas id="cv"></canvas>
        <button class="b pri" id="btn-amostra">🥤 Amostra</button>
        <div id="toasts"></div>
        <div id="status"></div>
      </div>
    </section>
  </div>
</div>
<div class="modal" id="modal"><div class="jan" id="jan"></div></div>

<script src="pubchem.js?v=1"></script>
<script src="dados.js?v=5"></script>
<script src="quimica.js?v=11"></script>
<script src="motor.js?v=13"></script>
<script src="fisica.js?v=3"></script>
<script src="microscopio.js?v=3"></script>
<script src="alimentos.js?v=2"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const n1 = (v, d = 1) => v === null || v === undefined || Number.isNaN(v) ? '—' : (Math.round(v * 10 ** d) / 10 ** d).toLocaleString('pt-BR');
const TOQUE = matchMedia('(pointer: coarse)').matches;
const avisar = (evento, extra = {}) => { try { parent.postMessage({ fonte: 'arcadia-jogo', id: 'laboratorio-dos-elementos', evento, ...extra }, '*'); } catch (e) {} };

/* ---------- estado da interface ---------- */
const UI = { aba: 'tabela', sel: id('H2O'), ferr: 'desenhar', busca: '', amostra: { mapa: new Map(), total: 0 }, hover: null, pressionado: false, ultimoXY: null };
const FERRAMENTAS = [
  ['desenhar', '✏️', 'Colocar'], ['apagar', '🧽', 'Apagar'], ['aquecer', '🔥', 'Aquecer'], ['resfriar', '❄️', 'Resfriar'], ['temp', '🌡️', 'Definir °C'], ['faisca', '⚡', 'Faísca / corrente'],
  ['ima', '🧲', 'Ímã'], ['martelo', '🔨', 'Martelo'], ['ph', '🧫', 'Fita de pH'], ['inspecionar', '🔍', 'Inspecionar'], ['micro', '🔬', 'Microscópio'], ['mexer', '🥄', 'Mexer / sovar'], ['geiger', '☢️', 'Geiger'], ['coletar', '🥤', 'Coletar amostra'],
];
const ABAS = [['tabela', 'Tabela'], ['gas', 'Gases'], ['liquido', 'Líquidos'], ['solido', 'Sólidos'], ['compostos', 'Compostos'], ['solucoes', 'Soluções'], ['casa', 'Casa'], ['alimentos', 'Alimentos'], ['lab', 'Laboratório']];
$('#ferr').innerHTML = FERRAMENTAS.map(([k, ic, n]) => `<button data-f="${k}" class="${k === UI.ferr ? 'on' : ''}" title="${n}">${ic} <span>${n}</span></button>`).join('');
$('#ferr').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; escolherFerr(b.dataset.f); });
function escolherFerr(f) { UI.ferr = f; [...$('#ferr').children].forEach(x => x.classList.toggle('on', x.dataset.f === f)); dicaFerr(); }
function dicaFerr() {
  const d = { desenhar: 'Arraste na caixa para colocar o material escolhido.', apagar: 'Arraste para apagar.', aquecer: 'Segure em cima de algo para esquentar (até 6000 °C).', resfriar: 'Segure para esfriar (até −273 °C).', temp: 'Define a temperatura exata do que estiver no pincel (escolha o valor em "Temperatura ao colocar").',
    faisca: 'Solta faíscas que voam, caem e acendem o que tocam (gases, álcool, pó de metal, espuma de hidrogênio). Em metais, grafite e soluções liga a corrente: eletrólise, e fios finos como a palha de aço esquentam até pegar fogo. Segure para um borrifo contínuo.', ima: 'Atrai ferro, cobalto, níquel e magnetita em pó (só abaixo da temperatura de Curie).', martelo: 'Bate: materiais quebradiços viram pó; metais dúcteis só amassam.',
    mexer: 'Arraste sobre ingredientes para misturar, sovar (forma o glúten) ou bater (claras em neve). Óleo e água só se misturam com um emulsificante, como a gema.',
    micro: 'Passe o microscópio (ou toque) em qualquer ponto: mostra as moléculas e explica o que está acontecendo ali, com os números da simulação.',
    ph: 'Toque numa solução para medir o pH.', inspecionar: 'Toque para ver tudo sobre aquela célula.', geiger: 'Conta a radioatividade perto do ponteiro.', coletar: 'Arraste para recolher uma amostra no copo. Depois aperte "🥤 Amostra" para analisar ou simular no organismo.' }[UI.ferr];
  statusExtra = d;
}

/* ---------- abas e paleta ---------- */
$('#abas').innerHTML = ABAS.map(([k, n]) => `<button data-a="${k}" class="${k === UI.aba ? 'on' : ''}">${n}</button>`).join('');
$('#abas').addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b) return; UI.aba = b.dataset.a; UI.busca = ''; $('#busca').value = ''; [...$('#abas').children].forEach(x => x.classList.toggle('on', x === b)); renderPaleta(); });
$('#busca').addEventListener('input', e => { UI.busca = e.target.value.trim().toLowerCase(); renderPaleta(); });
const cssRgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;
function botaoMat(m) { const s = estadoDe(m, L.AMB); return `<button class="mt ${m.id === UI.sel ? 'sel' : ''}" data-m="${m.id}" title="${esc(m.nome)}"><span class="sw" style="background:${cssRgb(m.rgb[s])}"></span><span><b>${esc(m.simb || fmt(m.formula).slice(0, 14))}</b><small>${esc(nomeNoEstado(m, s))}</small></span></button>`; }
const COLOCAVEIS = () => MATS.filter(m => m.id > 2 && (m.tipo === 'elemento' || m.tipo === 'composto') && m.chave !== 'Parede');
function categoria(m) {
  const k = m.chave;
  if (m.casa) return 'Produtos de casa';
  if (m.reagente) return 'Reagentes de laboratório';
  if (m.liga) return 'Ligas metálicas';
  if (m.vidro || m.inerte) return 'Recipientes';
  if (/O\d*$|O2$/.test(m.formula) && !m.ions && m.formula !== 'H2O' && !/CO|SO|NO/.test(m.formula) || m.oxidoBasico) return 'Óxidos';
  if (m.ions && m.ions[1] === 'OH') return 'Hidróxidos (bases)';
  if (m.ions || m.estimado) return 'Sais';
  if (['H2SO4', 'HNO3', 'H3PO4', 'AguaRegia'].includes(k)) return 'Ácidos concentrados';
  if (estadoDe(m, 25) === 2) return 'Gases';
  return 'Outros';
}
function renderPaleta() {
  const P = $('#paleta'); let h = '';
  const casa = m => !UI.busca || (m.nome + ' ' + (m.simb || '') + ' ' + m.formula + ' ' + (m.chave || '')).toLowerCase().includes(UI.busca);
  if (UI.busca) {
    const l = MATS.filter(m => m.id > 2 && m.tipo !== 'especial' && casa(m)).slice(0, 80);
    h = `<div class="sec">Resultados (${l.length})</div><div class="lista">${l.map(botaoMat).join('') || '<span class="muted">Nada encontrado.</span>'}</div>`;
  } else if (UI.aba === 'tabela') h = tabelaPeriodica();
  else if (['gas', 'liquido', 'solido'].includes(UI.aba)) {
    const alvo = { gas: 2, liquido: 1, solido: 0 }[UI.aba];
    const els = COLOCAVEIS().filter(m => m.tipo === 'elemento' && estadoDe(m, L.AMB) === alvo).sort((a, b) => a.z - b.z);
    const comps = COLOCAVEIS().filter(m => m.tipo === 'composto' && !m.inerte && estadoDe(m, L.AMB) === alvo);
    h = `<div class="sec">Elementos ${['sólidos', 'líquidos', 'gasosos'][alvo]} a ${L.AMB} °C (${els.length})</div><div class="lista">${els.map(botaoMat).join('') || '<span class="muted">Nenhum nesta temperatura.</span>'}</div>`;
    h += `<div class="sec">Compostos (${comps.length})</div><div class="lista">${comps.map(botaoMat).join('') || '<span class="muted">Nenhum.</span>'}</div>`;
    h += `<p class="muted" style="font-size:11.5px">Mude a temperatura ambiente lá em cima e veja os elementos trocarem de aba.</p>`;
  } else if (UI.aba === 'compostos') {
    const grupos = {}; for (const m of COLOCAVEIS().filter(m => m.tipo === 'composto' && !m.inerte && !m.vidro)) (grupos[categoria(m)] = grupos[categoria(m)] || []).push(m);
    for (const g of ['Produtos de casa', 'Reagentes de laboratório', 'Óxidos', 'Sais', 'Hidróxidos (bases)', 'Ácidos concentrados', 'Gases', 'Ligas metálicas', 'Outros']) if (grupos[g]) h += `<div class="sec">${g} (${grupos[g].length})</div><div class="lista">${grupos[g].map(botaoMat).join('')}</div>`;

function simularOrganismo(l) {

/* ---------- som (bem discreto) ---------- */
let AC = null;
function iniciarAudio() { if (AC) return; try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
function som(t) {
  if (!AC) return; const a = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.connect(g).connect(AC.destination);
  const p = { nova: [880, 1320, 0.08, 'sine', 0.05], faisca: [2400, 600, 0.12, 'square', 0.03], martelo: [180, 60, 0.15, 'triangle', 0.15], clique: [1200, 1200, 0.04, 'square', 0.03], alerta: [440, 220, 0.4, 'sawtooth', 0.05], geiger: [3000, 3000, 0.01, 'square', 0.04], boom: [90, 30, 0.6, 'sawtooth', 0.25] }[t]; if (!p) return;
  o.type = p[3]; o.frequency.setValueAtTime(p[0], a); o.frequency.exponentialRampToValueAtTime(p[1], a + p[2]); g.gain.setValueAtTime(p[4], a); g.gain.exponentialRampToValueAtTime(0.0001, a + p[2]); o.start(a); o.stop(a + p[2] + 0.02);
}

/* ---------- laço ---------- */
let ultimo = performance.now(), acc = 0, explosoesVistas = 0, tremor = 0;
function quadro(agora) {
  requestAnimationFrame(quadro);
  const dt = Math.min(0.1, (agora - ultimo) / 1000); ultimo = agora;
  if (!L.pausado) {
    acc += dt * 60 * L.vel; let n = 0;
    while (acc >= 1 && n < 6) { passo(); acc -= 1; n++; }
    if (n >= 6) acc = 0;

  }

  const g = desenharGrade(ctx);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  if (tremor > 0) { cv.style.transform = `translate(${(Math.random() - 0.5) * tremor}px,${(Math.random() - 0.5) * tremor}px)`; tremor = Math.max(0, tremor - 0.5); if (!tremor) cv.style.transform = ''; }
  ctx.drawImage(g, 0, 0);
  desenharExtras(ctx);
  if (UI.ferr === 'micro') atualizarMicro(); else if (micro.style.display !== 'none') micro.style.display = 'none';
  // contorno do pincel
  if (UI.hover) { const r = +$('#tam').value - 1; ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1 / Math.max(1, PX / 2); ctx.beginPath(); ctx.arc(UI.hover[0] + 0.5, UI.hover[1] + 0.5, UI.ferr === 'ima' ? 14 + r * 2 : UI.ferr === 'geiger' ? 20 : r + 0.5, 0, Math.PI * 2); ctx.stroke(); }
  if (L.tick % 4 === 0) { statusHover(); verEventos(); $('#b-agit').classList.toggle('on', !!L.agitador); if (+$('#amb').value !== Math.round(L.AMB)) { $('#amb').value = L.AMB; $('#amb-v').textContent = Math.round(L.AMB) + ' °C'; } }
}
montarCaixa(); renderPaleta(); renderFichaMini(); dicaFerr();
// cena inicial: um béquer com água e um pouco de sódio ao lado, para convidar a experimentar
EXPERIMENTOS[0].f(L.W, L.H);
toast('Bem-vindo ao laboratório!', 'Escolha um elemento na tabela, arraste na caixa e veja o que acontece. 🧪 Experimentos traz cenas prontas.', 8000);
requestAnimationFrame(quadro);
avisar('iniciado');
// ganchos para testes automáticos
window.__lab = { L, MATS, id, regra, passo, pincel, celula, avaliarAmostra, solucao, limparTudo, EXPERIMENTOS, CORPOS, FIS, cenaDe, explicarMicro, get grade() { return { mt, T, flg, dis, disG, gv, bfl, corpo }; } };
